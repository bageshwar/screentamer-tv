name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, commit and tag
        id: bump
        run: |
          output=$(bash scripts/bump-version.sh)
          echo "$output"
          if [[ "$output" == *"skipped=true"* ]]; then
            echo "Release commit by the bot — nothing to do."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(echo "$output" | grep '^version=' | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
          git push origin "v$version"

  build-and-release:
    name: Build signed APK and create release
    needs: bump
    if: needs.bump.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore and credentials
        env:
          JKS_BASE64: ${{ secrets.JKS_BASE64 }}
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$JKS_BASE64" | base64 -d > agent/keystore.jks
          printf 'release.keystore.path=keystore.jks\nrelease.keystore.password=%s\nrelease.key.alias=%s\nrelease.key.password=%s\n' \
            "$KS_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > agent/local.properties

      - name: Build release APK
        working-directory: agent
        run: ./gradlew :app:assembleRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: Release v${{ needs.bump.outputs.version }}
          generate_release_notes: true
          files: agent/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
